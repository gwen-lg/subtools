[package]
name = "subtools"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A library of utils to operate traitements on subtitles. Also contain a cli app to use fonctionnalities."
repository = "https://github.com/gwen-lg/subtools"
authors = ["Gwen Lg <me@gwenlg.fr>"]
keywords = ["subtitles", "subtile", "parse", "editing"]
categories = ["command-line-utilities"]
rust-version = "1.88"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
anyhow = "1.0"
chardetng = "0.1"
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
subtile = "0.4"
subtile-ocr = "0.2"
thiserror = "2.0"

[patch.crates-io]
subtile = { path = "../subtile" }
subtile-ocr = { path = "../subtile-ocr" }

[lints.rust]
missing_docs = "warn"
unused_imports = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
# default complexity = { level = "warn", priority = -1 }
# default: correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# default: style = { level = "warn", priority = -1 }
# default: suspicious = { level = "warn" }
# The individually activated lints below come from : nursery or restriction.
allow_attributes = "warn"
as_ptr_cast_mut = "warn"
branches_sharing_code = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
default_union_representation = "warn"
derive_partial_eq_without_eq = "warn"
disallowed_script_idents = "warn"
empty_enum_variants_with_brackets = "warn"
equatable_if_let = "warn"
exit = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
future_not_send = "warn"
get_unwrap = "warn"
imprecise_flops = "warn"
infinite_loop = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
large_stack_frames = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
missing_const_for_fn = "warn"
mutex_integer = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
non_zero_suggestions = "warn"
nonstandard_macro_braces = "warn"
option_if_let_else = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
pathbuf_init_then_push = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
set_contains_or_insert = "warn"
significant_drop_tightening = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
uninhabited_references = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
unused_trait_names = "warn"
use_self = "deny"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"
